name: AssetShakti Dependency Remediation

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/assetshakti-dependency-remediation.yml"
  push:
    branches:
      - "assetshakti/phase1.5-multi-auction-source-foundation"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assetshakti-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install before remediation
        run: npm ci

      - name: Apply compatible npm audit fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only

      - name: Capture post-remediation audit evidence
        run: npm audit --json > npm-audit-post-remediation.json || true

      - name: Upload post-remediation audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetshakti-npm-audit-post-remediation
          path: npm-audit-post-remediation.json
          if-no-files-found: error

      - name: Check whether the lockfile changed
        id: diff
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reinstall from proposed lockfile
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Security gate after remediation
        if: steps.diff.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: AssetShakti source-adapter regression
        if: steps.diff.outputs.changed == 'true'
        run: npm run assetshakti:test:source-adapters

      - name: AssetShakti source-discovery regression
        if: steps.diff.outputs.changed == 'true'
        run: npx tsx assetshakti/phase1/source-discovery.test.ts

      - name: AssetShakti core validation
        if: steps.diff.outputs.changed == 'true'
        run: npm run assetshakti:validate

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: TypeScript validation
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: Commit validated remediation
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Remediate npm dependency vulnerabilities"
          git push

      - name: Report no compatible remediation
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "No compatible lockfile/package changes were produced."
          echo "Production security gate remains open if npm audit reports high/critical findings."
