name: AssetShakti Live Auction Source Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover public auction source surfaces
        run: node assetshakti/phase1/discover-live-auction-sources.mjs
      - name: Commit discovery evidence
        run: |
          git config user.name "assetshakti-bot"
          git config user.email "assetshakti-bot@users.noreply.github.com"
          git add assetshakti/phase1/live-source-evidence/latest-discovery.json
          git diff --cached --quiet || git commit -m "AssetShakti: refresh live auction source discovery"
          git push
